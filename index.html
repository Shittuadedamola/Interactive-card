<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <section class="h-[250px] bg-purple-900 relative">
        <div class="w-[300px] h-[150px] bg-white rounded-lg pt-5 absolute top-10 right-7">
            <div class="w-[100%] h-[30%] bg-black"></div>
            <div class="w-[80%] h-[25%] bg-gray-400 rounded text-white text-sm mx-auto mt-3 flex items-center justify-end pe-5 italic">000</div>
        </div>
        <div class="w-[300px] h-[150px] bg-linear-to-r from-indigo-500 via-pink-500 to-purple-500 rounded-lg pt-5 absolute top-36 left-7 p-5">
            <div class="flex items-center">
                <div class="w-[35px] h-[35px] bg-white rounded-full mr-3"></div>
                <div class="w-[15px] h-[15px] border border-white rounded-full border-2"></div>
            </div>
            <div class="text-white mt-6 text-2xl">0000 0000 0000 0000</div>
            <div class="text-white mt-1 flex justify-between">
                <span>
                    Jane Appleseed
                </span>
                <span>
                    <span>00</span>
                    /
                    <span>
                        00
                    </span>
                </span>
            </div>
        </div>
    </section>

    <section class="mt-20 p-10">
        <div class="flex flex-col">
            <label for="email" class="mb-2 font-bold">CARDHOLDER NAME</label>
            <input type="email" placeholder="e.g. Jane Appleseed"
            class="border border-gray-300 rounded-md p-2 text-2xl text-gray-400">
        </div>
    </section>
</body>
</html>
